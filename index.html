<!doctype html>
<html lang="en">
  <head>
    <title>Cielo's Zone</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link href="https://fonts.googleapis.com/css?family=Joti+One" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Berkshire+Swash" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Patua+One" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Permanent+Marker" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-alpha.6/css/bootstrap.min.css" integrity="sha384-rwoIResjU2yc3z8GV/NPeZWAv56rSmLldC3R/AZzGRnGxQQKnKkoFVhFQhNUwEyJ" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.6/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta.2/js/bootstrap.min.js"></script>
    <script defer src="https://use.fontawesome.com/releases/v5.0.4/js/all.js"></script>
    <script src="js/modalImage.js"></script>
  </head>
  <body>
    <div class="container">
      <nav class="navbar navbar-light navbar-toggleable-md bg-faded fixed-top">
        <button class="navbar-toggler navbar-toggler-right" type="button" data-toggle="collapse"
                data-target="#navbarText" aria-controls="navbarText"
                aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarText">
          <ul class="navbar-nav">
            <li class="nav-item active"><a href="index.html" class="nav-link">Home <span class="sr-only">(current)</span></a></li>
            <li class="nav-item"><a href="#" class="nav-link">About</a></li>
            <li class="nav-item"><a href="#" class="nav-link">Photo</a></li>
            <li class="nav-item"><a href="#" class="nav-link">Journal</a></li>
            <li class="nav-item"><a href="#" class="nav-link">Resume</a></li>
            <li class="nav-item"><a href="#" class="nav-link">Contact</a></li>
          </ul>
        </div>
      </nav>
    </div>
    <header>
      <div class="container">
        <div class="row header-section">
          <div class="col-2 col-sm-2 col-md-1 col-lg-1 col-xl-1">
            <img alt="logo" src="img/udacity.png"
                 id="header-logo" class="img-fluid"/>
          </div>
          <div class="col-10 col-sm-10 col-md-11 col-lg-11 col-xl-11" id="header-text-block">
            <h1 id="header-text">Yutian Wu</h1>
          </div>
        </div>
      </div>
    </header>
    <main>
      <div class="container">
        <section class="cover">
          <div class="cover-img" id="cover-img-1"></div>
          <div class="cover-img" id="cover-img-2"></div>
          <div class="cover-badge">
            <span class="badge" onclick="currentDiv(1)"></span>
            <span class="badge" onclick="currentDiv(2)"></span>
          </div>
        </section>
      </div>
      <div class="container">
        <section class="featured-work">
          <h2 id="featured-work-title">Featured Work</h2>
          <div class="row">
            <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
              <figure class="photo">
                <img alt="Paris" src="img/paris.jpg" class="img-thumbnail"
                     id="paris" onclick="showimage('paris');"/>
                <figcaption>Paris's Summer</figcaption>
              </figure>
            </div>
            <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12 col-12">
              <figure class="photo">
                <img alt="Barcelona" src="img/barcelona.jpg"
                     class="img-thumbnail" id="barcelona"
                     onclick="showimage('barcelona');"/>
                <figcaption>Barcelona</figcaption>
              </figure>
            </div>
            <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12 col-12">
              <figure class="photo">
                <img alt="Citta del Vaticano" src="img/vaticano.jpg"
                     class="img-thumbnail" id="vaticano"
                     onclick="showimage('vaticano');"/>
                <figcaption>Vaticano</figcaption>
              </figure>
            </div>
          </div>
        </section>
      </div>
      <div id="modal-img" class="modal container-fluid">
        <i class="close fas fa-times"></i>
        <figure class="modal-fig">
          <img class="modal-content" id="img"/>
          <figcaption id="caption"></figcaption>
        </figure>
      </div>
    </main>
    <footer>
      <div class="container footer-section">
        <p class="clear-margin">Posted by: Yutian Wu</p>
        <p class="contact clear-margin">Contact information:&nbsp;
          <a href="mailto:yutian.wu@umich.edu"><i class="fas fa-envelope" data-fa-transform="grow-2.5"></i></a>&nbsp;&nbsp;
          <a href="https://github.com/cielong"><i class="fab fa-github" data-fa-transform="grow-2.5"></i></a>&nbsp;&nbsp;
          <a href="https://www.linkedin.com/in/cielowu/"><i class="fab fa-linkedin" data-fa-transform="grow-2.5"></i></a>
        </p>
      </div>
    </footer>
    <script src="js/slideImage.js"></script>
  </body>
</html>
